<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Proxy Toggle</title>
    <meta name="manifest.default_icon" content="icon.png" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div class="header">
      <img class="logo" src="/tailscale-logo.svg" alt="Tailscale" />
      <label class="slider-container">
        <input type="checkbox" id="toggleSlider" class="slider-input" checked />
        <span class="slider connected no-transition"></span>
      </label>
    </div>
    <div id="state" class="status"></div>
    <div class="controls">
      <button id="settingsButton" class="settings-button">Settings</button>
    </div>
  </body>
</html>
